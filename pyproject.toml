[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-grader-skills"
version = "0.1.0"
description = "Human-reviewed handwriting grading skill and preflight tools"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "openpyxl>=3.1,<4", "pypdf>=6.5,<7"]

[project.scripts]
handwriting-grader = "handwriting_grader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
